name: Build and deploy Sphinx documentation to Pages

on:
  # Build and deploy documentation after changes are merged to master
  push:
    branches: [master]

  # Build documentation for PRs that touch Documentation/**
  pull_request:
    paths:
      - 'doc/**'

jobs:
  pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - id: deployment
        name: Build documentation
        uses: sphinx-notes/pages@v3
        with:
          publish: false
          documentation_path: ./doc
          requirements_path: ./doc/requirements.txt

      - name: Deploy documentation
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ steps.deployment.outputs.artifact }}
