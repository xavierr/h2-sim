name: Build and deploy documentation

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - 'doc/**'
      - '.github/workflows/doc.yml'
      - 'tools/**'
      - 'utils/setupIpynbForH2sim.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: doc/requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r doc/requirements.txt
      - name: Check notebook conversion
        run: python -m unittest discover -s tools/tests
      - name: Build documentation without MATLAB execution
        run: python -m sphinx -W --keep-going -b html doc build/docs
      - name: Check local documentation links and images
        run: python tools/check_documentation.py build/docs
      - uses: actions/upload-artifact@v6
        with:
          name: documentation-preview
          path: build/docs
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: documentation-preview
          path: build/docs
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/docs
